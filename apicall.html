<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #navbar {
            display: flex;
            width: 100%;
            padding: 10px;
            background-color: rgb(11, 10, 10);
        }
        #navbar a {
            color: rgb(255, 252, 252);
            text-decoration: none;
            font-size: 23px;
            border: 1px solid black;
            padding: 5px 20px;
            border-radius: 10px;
            background-color: rgb(17, 17, 17);
        }
        #navbar #links{
            display: flex;
            width: 20%;
            justify-content: space-evenly;
        }
        #navbar input {
            width: 250px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid black;
        }
        #navcart {
            position: relative;
        }
        #count {
            position: absolute;
            bottom: 4px;
            right:-5px;
            background-color: rgb(117, 115, 115);
            color: rgb(248, 246, 246);
            border-radius: 100%;
            width: 20px;
            height: 20px;
            font-style: bold;
            display: flex;
            justify-content: center;
            font-size: 17px;
        }
        form {
            border: 2px solid;
            padding: 20px;
            margin: 20px;
        }

        #products {
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            justify-content: space-evenly;
            background-color: rgb(117, 121, 123);
        }

        #products li {
            width: 200px;
            padding: 10px;
            border: 1px solid gray;
            text-align: center;
            margin: 10px;
            border-radius: 10px;
            background-color: rgb(248, 249, 249);

        }

        #products li img {
            width: 100%;
        }

        #details {
            display: none;
            position: fixed;
            top: 10%;
            left: 50%;
            width: 300px;
            height: 400px;
            background-color: white;
            border: 2px solid black;
            transform: translateX(-50%);
            width: 70%;
            border-radius: 10px;
            padding: 10px;
        }

        #details button {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        #modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
        }
    </style>
</head>
<body>
    <div id="navbar">
        <input type="text" id="search" placeholder="Search products..." oninput="search()">
        <div id="links">
            <a href="./apicall.html">Home</a>
            <a href="./cart.html" id="navcart">Cart<p id="count"></p></a>
        </div>
    </div>
    <div id="modal" onclick="mclose()">
        <div id="details" onclick="dontclose(event)">
            <h1 id="ptitle"></h1>

        </div>
    </div>
    <ul id="products">

    </ul>
    <script>
        let cart = JSON.parse(window.localStorage.getItem("cart"));
        document.getElementById("count").innerText = cart.length;
        function search() {
            var input = document.getElementById("search").value.toLowerCase();
            var filteredProducts = products.filter(product => product.title.toLowerCase().includes(input));
            document.getElementById("products").innerHTML = "";
            filteredProducts.forEach(product => {
                var pcard = `
                    <a href="./product-details.html?id=${product.id}" target="_blank">
                        <li>
                            <img src="${product.thumbnail}">
                            <h4>${product.title}</h4>
                        </li>
                    </a>
                `
                document.getElementById("products").innerHTML += pcard;
            })
        }
        var products=[];
        function genUI(){
            fetch("https://dummyjson.com/products")
            .then(res => res.json())
            .then(data => {
                data.products.forEach(product => {
                    products.push(product) ;
                    var pcard = `
                        <a href="./product-details.html?id=${product.id}" target="_blank">
                            <li>
                                <img src="${product.thumbnail}">
                                <h4>${product.title}</h4>
                            </li>
                        </a>
                    `
                    document.getElementById("products").innerHTML += pcard;
                })
                console.log(products);
            })
        }
        genUI();

        //         .then(data => {

        //                 <h2>${data.title}</h2>
        //                 <p>${data.description}</p>
        //                 <img src="${data.thumbnail}" alt="${data.title}">
        //                 <button onclick="mclose(event)">X</button>
        //             `;
        //         })

    </script>
</body>

</html>
