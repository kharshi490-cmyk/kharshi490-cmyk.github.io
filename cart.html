<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #navbar {
            display: flex;
            width: 100%;
            padding: 10px;
            background-color: rgb(11, 10, 10);
        }
        #navbar a {
            color: rgb(255, 252, 252);
            text-decoration: none;
            font-size: 23px;
            border: 1px solid black;
            padding: 5px 20px;
            border-radius: 10px;
            background-color: rgb(17, 17, 17);
        }
        #navbar #links{
            display: flex;
            width: 20%;
            justify-content: space-evenly;
        }
        #navbar input {
            width: 250px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid black;
        }
        #navcart {
            position: relative;
        }
        #count {
            position: absolute;
            bottom: 4px;
            right:-5px;
            background-color: rgb(117, 115, 115);
            color: rgb(248, 246, 246);
            border-radius: 100%;
            width: 20px;
            height: 20px;
            font-style: bold;
            display: flex;
            justify-content: center;
            font-size: 17px;
        }
        .card {
            border: 1px solid black;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            background-color: rgb(248, 249, 249);
        }
        .product {
            border: 1px solid gray;
            display: flex;
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
            background-color: rgb(255, 255, 255);
        }
        .product img {
            width: 100px;
            height: 100px;
        }
        #quantity {
            display: flex;
        }
        #quantity button {
            width: 40px;
            height: 40px;
            border: none;
            background-color: rgb(63, 58, 58);
            color: white;
            font-size: 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        #quantity h4 {
            margin: 0 10px;
            display: flex;
            align-items: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="navbar">
        <input type="text" id="search" placeholder="Search products..." include="search">
        <div id="links">
            <a href="./apicall.html">Home</a>
            <a href="./cart.html" id="navcart">Cart<p id="count"></p></a>
        </div>
    </div>
    <div class="card" id="cart"></div>
    <script>
        let cart = JSON.parse(window.localStorage.getItem("cart"));
        document.getElementById("count").innerText = cart.length;
        if (!cart||cart.length === 0) {
            document.getElementById("cart").innerHTML = "<h2>Cart is empty</h2>";
        }
        else {
            let total = 0;
            cart.forEach(product => {
                product.totalPrice = product.price * (product.quantity || 1);
                total += product.totalPrice;
                product.quantity = product.quantity || 1;
                document.getElementById("cart").innerHTML += `
                    <div class="product">
                        <img src="${product.thumbnail}" alt="${product.title}">
                        <div id="details">
                            <h3>${product.title}</h3>
                            <p><b>Price:</b> $${product.price}</p>
                            <div id="quantity">
                                <button id="add" onclick="addProduct('${product.id}')">+</button>
                                <h4>${product.quantity}</h4>
                                <button id="remove" onclick="removeProduct('${product.id}')">-</button>
                            </div>
                            <p><b>Total Price:</b> $${product.price * product.quantity}</p>
                        </div>
                    </div>`;
            });
            document.getElementById("cart").innerHTML += `<h2>Total: $${total}</h2>`;
        }
        function addProduct(id) {
            let product = cart.find(p => p.id == id);
            product.quantity = (product.quantity || 1) + 1; 
            window.localStorage.setItem("cart", JSON.stringify(cart));
            location.reload();
        }
        function removeProduct(id) {
            let index = cart.findIndex(p => p.id == id);
            if (index > -1) {
                cart[index].quantity = (cart[index].quantity || 1) - 1; 
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1); 
                }
                window.localStorage.setItem("cart", JSON.stringify(cart));
                location.reload();
            }
        }
    </script>
</body>
</html>
